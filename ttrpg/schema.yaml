# Note types and their frontmatter fields.
#
# Field kinds: str, int, date (in-game YYYY-MM-DD), day (real-world YYYY-MM-DD),
# list, enum (with `values`), ref (one note id, `to` lists allowed types),
# refs (list of note ids). An int may set `min` and `max`.
#
# A relation is declared on one side only. `inverse` names the computed view
# on the target (shown by exports and backlinks); writing that inverse field by
# hand is reported as an unknown field, so there is never a second copy to drift.

common:
  type: {kind: enum, required: true}
  title: {kind: str, required: true}
  origin: {kind: enum, values: [ap, modified, custom], default: custom}
  visibility: {kind: enum, values: [gm, players], default: gm}
  prep: {kind: enum, values: [draft, ready], default: draft}
  aliases: {kind: list}
  tags: {kind: list}
  source: {kind: str}
  source_hash: {kind: str}
  foundry: {kind: str}

places: &places [location, settlement, hex, region]

types:
  note: {}
  chapter: {}
  handout: {}
  item:
    level: {kind: int}
    owner: {kind: ref, to: [npc, faction], inverse: possessions}
    location: {kind: ref, to: *places, inverse: items}
    stats: {kind: str}
  region:
    region: {kind: ref, to: [region], inverse: subregions}
    discovered: {kind: enum, values: ["yes", "no"], default: "no"}
    map: {kind: ref, to: [map]}
    cells: {kind: list}
  hex:
    coord: {kind: str}
    terrain: {kind: str}
    region: {kind: ref, to: [region], inverse: hexes}
    discovered: {kind: enum, values: ["yes", "no"], default: "no"}
    map: {kind: ref, to: [map]}
    cells: {kind: list}
  settlement:
    region: {kind: ref, to: *places, inverse: settlements}
    leader: {kind: ref, to: [npc]}
    level: {kind: int}
    population: {kind: int}
    government: {kind: str}
    discovered: {kind: enum, values: ["yes", "no"], default: "no"}
    map: {kind: ref, to: [map]}
    cells: {kind: list}
  location:
    in: {kind: ref, to: *places, inverse: contains}
    discovered: {kind: enum, values: ["yes", "no"], default: "no"}
    map: {kind: ref, to: [map]}
    cells: {kind: list}
  npc:
    state: {kind: enum, values: [alive, dead, missing, unknown], default: alive}
    level: {kind: int}
    ancestry: {kind: str}
    died: {kind: date}
    location: {kind: ref, to: *places, inverse: residents}
    factions: {kind: refs, to: [faction], inverse: members}
    stats: {kind: str}
    adjust: {kind: enum, values: [elite, weak]}
    owners: {kind: list}
  faction:
    leader: {kind: ref, to: [npc]}
    base: {kind: ref, to: *places}
    reputation: {kind: int, min: -50, max: 50}
  pc:
    player: {kind: str}
    state: {kind: enum, values: [playing, absent, retired, dead], default: playing}
    level: {kind: int}
    ancestry: {kind: str}
    class: {kind: str}
    location: {kind: ref, to: *places}
  company:
    renown: {kind: enum, values: [unknown, neighbourhood, local, regional, international, legendary], default: unknown}
    base: {kind: ref, to: *places}
  mystery:
    state: {kind: enum, values: [open, solved, abandoned], default: open}
  scene:
    chapter: {kind: ref, to: [chapter]}
    location: {kind: ref, to: *places, inverse: scenes}
    level: {kind: int}
  quest:
    state: {kind: enum, values: [open, active, done, failed], default: open}
    giver: {kind: ref, to: [npc, faction]}
  event:
    date: {kind: date, required: true}
    participants: {kind: refs, to: [npc, faction]}
    location: {kind: ref, to: *places}
    played: {kind: enum, values: ["yes", "no"], default: "no"}
  clock:
    segments: {kind: int, required: true}
    filled: {kind: int, default: 0}
    owner: {kind: ref, to: [npc, faction]}
  map:
    kind: {kind: enum, values: [battle, overview], default: battle}
    image: {kind: str}
    stage: {kind: enum, values: [raw, walled, lit, ready], default: raw}
    grid: {kind: int}
    locations: {kind: refs, to: *places, inverse: maps}
  session:
    day: {kind: day, required: true}
    ingame: {kind: date}
    level: {kind: int}
    present: {kind: list}
